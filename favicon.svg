<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ngubohlanga" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ngubohlanga Tourism &amp; Executive Transport</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#F5DE9B"/>
      <stop offset="45%" stop-color="#D9A526"/>
      <stop offset="100%" stop-color="#B8861A"/>
    </linearGradient>
  </defs>

  <!-- sun -->
  <circle cx="25.6" cy="6.2" r="3.5" fill="#F7E4A8"/>

  <!-- twin peak -->
  <path d="M11.6 2.4 17.2 13.4 20.6 8.8 29.6 21 2.4 21Z" fill="url(#gold)"/>

  <!-- road sweeping in from the bottom left -->
  <path d="M2 28.6C8 25.8 12 23.8 15.4 22.4L30 22.4"
        fill="none" stroke="url(#gold)" stroke-width="4.8" stroke-linecap="round"/>

  <!-- centre line: two chunky marks, the most that survives at 16px -->
  <g fill="#F7E4A8">
    <rect x="14.2" y="25.1" width="5.6" height="2.6" rx="1.3"/>
    <rect x="22.6" y="25.1" width="5.6" height="2.6" rx="1.3"/>
  </g>
</svg>
